name: build-and-publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build -o event-triage ./cmd/event-triage
      - name: Docker build and push
        if: github.ref_type == 'tag'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/thomasteoh/event-triage:latest
            ghcr.io/thomasteoh/event-triage:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=${{ github.repository_url }}
